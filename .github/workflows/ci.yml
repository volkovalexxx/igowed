name: CI

on:
  pull_request:
    branches:
      - main
      - client
      - backend
  push:
    branches:
      - main
      - client
      - backend

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Build web
        run: npm run build

      # После build: next-env.d.ts и .next/types уже сгенерированы, tsc видит весь проект,
      # включая *.test.ts (их не типизируют ни vitest, ни next build).
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build API
        run: npm run build:api

      - name: Test API
        run: npm run test

      - name: Build Docker images
        run: docker compose build web api
